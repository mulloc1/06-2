[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-git-cli"
version = "0.1.0"
requires-python = ">=3.10"
description = "Codyssey AI-powered Git commit and PR draft generator"

[project.scripts]
ai-git = "ai_git_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
